name: release

# Publishes to NuGet.org when a GitHub release is published, through NuGet trusted publishing (OIDC): the repository
# holds no NuGet API key. Set the repository variable NUGET_USER to the nuget.org account that owns Vexo.Server.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Check that the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(grep -oP '(?<=<Version>)[^<]+' src/Vexo/Vexo.csproj)"
      - run: dotnet test --configuration Release
      - run: dotnet pack src/Vexo/Vexo.csproj --configuration Release --output out
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
